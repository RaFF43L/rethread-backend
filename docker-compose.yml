services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rethread
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    ports:
      - '4566:4566'
    environment:
      SERVICES: s3,cognito-idp
      DEBUG: '0'
      PERSISTENCE: '1'
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-rethread-images}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./config/localstack/init/ready.d:/etc/localstack/init/ready.d
      - ./config/localstack/output:/output
    healthcheck:
      # Só fica "healthy" depois que o init criou o bucket e gravou o .env.localstack
      test:
        [
          'CMD-SHELL',
          'test -f /output/.env.localstack && awslocal s3 ls s3://${AWS_BUCKET_NAME:-rethread-images} >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - path: .env
        required: true
      # Valores do Cognito/S3 gerados pelo LocalStack (criado no primeiro boot)
      - path: config/localstack/output/.env.localstack
        required: false
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rethread
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: rethread
      AI_AGENT_URL: http://host.docker.internal:8000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
